<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eyewear Inventory</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --bg:#f7f7fb; --card:#fff; --border:#e2e2ea; --text:#222; --muted:#777; --accent:#3b5bfd; --danger:#d9534f; --danger-bg:#fdecea; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:var(--bg); color:var(--text); margin:0; padding:20px; }
  h1 { font-size:1.4rem; margin-bottom:4px; }
  .sub { color:var(--muted); margin-top:0; margin-bottom:20px; font-size:0.9rem; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:18px; margin-bottom:20px; }
  form { display:grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap:12px; }
  label { display:block; font-size:0.78rem; color:var(--muted); margin-bottom:4px; }
  input, select { width:100%; padding:8px; border:1px solid var(--border); border-radius:6px; font-size:0.9rem; text-transform:uppercase; }
  table { text-transform:uppercase; }
  th { text-transform:uppercase; }
  .full { grid-column: 1 / -1; }
  button { background:var(--accent); color:#fff; border:none; padding:10px 18px; border-radius:6px; font-size:0.9rem; cursor:pointer; margin-top:6px; }
  button.secondary { background:#eee; color:#333; }
  button:disabled { opacity:0.6; cursor:not-allowed; }
  .warning { background:var(--danger-bg); border:1px solid #f5c2c0; color:var(--danger); padding:12px; border-radius:8px; margin-top:14px; display:none; }
  .warning.show { display:block; }
  .warning button { margin-right:8px; }
  table { width:100%; border-collapse:collapse; font-size:0.85rem; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); white-space:nowrap; }
  th { color:var(--muted); font-weight:600; font-size:0.75rem; text-transform:uppercase; }
  tr.dup-highlight { background:#fff7e6; }
  .table-wrap { overflow-x:auto; }
  .status { font-size:0.85rem; color:var(--muted); margin-top:8px; }
  .search { margin-bottom:12px; }
  .config-note { font-size:0.8rem; color:var(--danger); }
</style>
</head>
<body>

<h1>Eyewear Inventory</h1>
<p class="sub">Add items below — the system checks for duplicates automatically before saving.</p>

<div class="card">
  <form id="itemForm">
    <div><label>Brand</label><input id="brand" list="dl-brand" required></div>
    <div><label>Model</label><input id="model" list="dl-model" required></div>
    <div><label>Size</label><input id="size" list="dl-size" required></div>
    <div><label>RIM Colour</label><input id="rimColour" list="dl-rimColour" required></div>
    <div><label>Side Colour</label><input id="sideColour" list="dl-sideColour" required></div>
    <div><label>Gender</label>
      <select id="gender"><option>UNI</option><option>MEN</option><option>WOMEN</option><option>KIDS</option></select>
    </div>
    <div><label>Material</label><input id="material" list="dl-material" required></div>
    <div><label>Rim Type</label>
      <select id="rimType"><option>FULL</option><option>RIMLESS</option><option>HALF</option></select>
    </div>
    <div><label>Shape</label><input id="shape" list="dl-shape" required></div>
    <div><label>Quantity</label><input id="quantity" type="number" min="1" value="1" required></div>
    <div><label>Box</label><input id="box" list="dl-box" value="BOX1"></div>
    <div><label>Price</label><input id="price"></div>

    <datalist id="dl-brand"></datalist>
    <datalist id="dl-model"></datalist>
    <datalist id="dl-size"></datalist>
    <datalist id="dl-rimColour"></datalist>
    <datalist id="dl-sideColour"></datalist>
    <datalist id="dl-material"></datalist>
    <datalist id="dl-shape"></datalist>
    <datalist id="dl-box"></datalist>
    <div class="full">
      <button type="submit" id="submitBtn">Check &amp; Add Item</button>
    </div>
  </form>

  <div id="warningBox" class="warning">
    <div id="warningText"></div>
    <div style="margin-top:10px;">
      <button id="updateQtyBtn" type="button">Add qty to existing item instead</button>
      <button id="forceAddBtn" type="button" class="secondary">Add as new item anyway</button>
      <button id="cancelBtn" type="button" class="secondary">Cancel</button>
    </div>
  </div>

  <div id="statusMsg" class="status"></div>
</div>

<div class="card">
  <input class="search" id="searchBox" placeholder="Search items...">
  <div class="table-wrap">
    <table id="itemsTable">
      <thead>
        <tr>
          <th>Brand</th><th>Model</th><th>Size</th><th>RIM</th><th>Side</th><th>Gender</th>
          <th>Material</th><th>Rim Type</th><th>Shape</th><th>Qty</th><th>Box</th><th>Price</th>
        </tr>
      </thead>
      <tbody id="itemsBody"></tbody>
    </table>
  </div>
</div>

<script>
  // ====== FILL THESE IN FROM YOUR SUPABASE PROJECT (Settings > API) ======
  const SUPABASE_URL = "https://kbcyqlmhniyogzjzukyf.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_K2JxfD93J3431fhJs71fAQ_NsgxQr1L";
  // =========================================================================

  let sb;
  let configured = SUPABASE_URL.startsWith("http") && SUPABASE_ANON_KEY.length > 10;
  if (configured) {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }

  const form = document.getElementById('itemForm');
  const warningBox = document.getElementById('warningBox');
  const warningText = document.getElementById('warningText');
  const statusMsg = document.getElementById('statusMsg');
  const updateQtyBtn = document.getElementById('updateQtyBtn');
  const forceAddBtn = document.getElementById('forceAddBtn');
  const cancelBtn = document.getElementById('cancelBtn');

  let pendingItem = null;
  let pendingDupRow = null;

  function up(v) { return v.trim().toUpperCase(); }

  function fields() {
    return {
      brand: up(document.getElementById('brand').value),
      model: up(document.getElementById('model').value),
      size: up(document.getElementById('size').value),
      rim_colour: up(document.getElementById('rimColour').value),
      side_colour: up(document.getElementById('sideColour').value),
      gender: up(document.getElementById('gender').value),
      material: up(document.getElementById('material').value),
      rim_type: up(document.getElementById('rimType').value),
      shape: up(document.getElementById('shape').value),
      quantity: parseInt(document.getElementById('quantity').value || "1"),
      box: up(document.getElementById('box').value),
      price: document.getElementById('price').value.trim(),
    };
  }

  function buildDescription(f) {
    return [f.brand, f.model, f.size, f.rim_colour, f.side_colour, f.gender, f.material, f.rim_type, f.shape]
      .join('|').toLowerCase().replace(/\s+/g, '');
  }

  function resetWarning() {
    warningBox.classList.remove('show');
    pendingItem = null;
    pendingDupRow = null;
  }

  function populateDatalist(id, values) {
    const dl = document.getElementById(id);
    dl.innerHTML = '';
    [...new Set(values.filter(Boolean))].sort().forEach(v => {
      const opt = document.createElement('option');
      opt.value = v;
      dl.appendChild(opt);
    });
  }

  function refreshDatalists(data) {
    populateDatalist('dl-brand', data.map(r => r.brand));
    populateDatalist('dl-model', data.map(r => r.model));
    populateDatalist('dl-size', data.map(r => r.size));
    populateDatalist('dl-rimColour', data.map(r => r.rim_colour));
    populateDatalist('dl-sideColour', data.map(r => r.side_colour));
    populateDatalist('dl-material', data.map(r => r.material));
    populateDatalist('dl-shape', data.map(r => r.shape));
    populateDatalist('dl-box', data.map(r => r.box));
  }

  async function loadItems(filter) {
    if (!configured) return;
    let query = sb.from('items').select('*').order('created_at', { ascending: false });
    const { data, error } = await query;
    const body = document.getElementById('itemsBody');
    body.innerHTML = '';
    if (error) { statusMsg.textContent = 'Error loading items: ' + error.message; return; }
    refreshDatalists(data);
    const rows = filter
      ? data.filter(r => JSON.stringify(r).toLowerCase().includes(filter.toLowerCase()))
      : data;
    rows.forEach(r => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${r.brand}</td><td>${r.model}</td><td>${r.size}</td><td>${r.rim_colour}</td>
        <td>${r.side_colour}</td><td>${r.gender}</td><td>${r.material}</td><td>${r.rim_type}</td>
        <td>${r.shape}</td><td>${r.quantity}</td><td>${r.box}</td><td>${r.price || ''}</td>`;
      body.appendChild(tr);
    });
  }

  document.getElementById('searchBox').addEventListener('input', (e) => loadItems(e.target.value));

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!configured) {
      statusMsg.textContent = "⚠️ Supabase isn't configured yet — fill in SUPABASE_URL and SUPABASE_ANON_KEY in the code.";
      return;
    }
    const f = fields();
    const desc = buildDescription(f);

    const { data: existing, error } = await sb.from('items').select('*').eq('description', desc);
    if (error) { statusMsg.textContent = 'Error checking duplicates: ' + error.message; return; }

    if (existing && existing.length > 0) {
      const match = existing[0];
      pendingItem = { ...f, description: desc };
      pendingDupRow = match;
      warningText.innerHTML = `⚠️ DUPLICATE FOUND: <b>${match.brand} ${match.model}</b> (SIZE ${match.size}, ${match.rim_colour}/${match.side_colour}) ALREADY EXISTS WITH QUANTITY <b>${match.quantity}</b>. WHAT WOULD YOU LIKE TO DO?`;
      warningBox.classList.add('show');
    } else {
      await saveNewItem(f, desc);
    }
  });

  async function saveNewItem(f, desc) {
    const { error } = await sb.from('items').insert([{ ...f, description: desc }]);
    if (error) { statusMsg.textContent = 'Error saving: ' + error.message; return; }
    statusMsg.textContent = '✅ Item added.';
    form.reset();
    document.getElementById('quantity').value = 1;
    loadItems();
  }

  updateQtyBtn.addEventListener('click', async () => {
    if (!pendingDupRow || !pendingItem) return;
    const newQty = pendingDupRow.quantity + pendingItem.quantity;
    const { error } = await sb.from('items').update({ quantity: newQty }).eq('id', pendingDupRow.id);
    if (error) { statusMsg.textContent = 'Error updating: ' + error.message; return; }
    statusMsg.textContent = `✅ Updated existing item's quantity to ${newQty}.`;
    form.reset();
    document.getElementById('quantity').value = 1;
    resetWarning();
    loadItems();
  });

  forceAddBtn.addEventListener('click', async () => {
    if (!pendingItem) return;
    await saveNewItem(pendingItem, pendingItem.description);
    resetWarning();
  });

  cancelBtn.addEventListener('click', resetWarning);

  if (!configured) {
    statusMsg.innerHTML = '<span class="config-note">Set SUPABASE_URL and SUPABASE_ANON_KEY in the code before this will work.</span>';
  } else {
    loadItems();
  }
</script>

</body>
</html>
